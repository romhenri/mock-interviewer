<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Agent Interviewer">
  <rect width="64" height="64" rx="14" fill="#13251a"/>

  <!-- neck, then suit over it so the collar sits on top -->
  <rect x="26" y="30" width="12" height="16" fill="#b6ab97"/>
  <path d="M6 64c0-11 8-17 17-19l9-2 9 2c9 2 17 8 17 19z" fill="#22262b"/>
  <path d="M32 43l-7 2 7 19 7-19z" fill="#e9ecef"/>
  <path d="M32 46l-3 3 3 15 3-15z" fill="#0e1114"/>

  <!-- head and slicked-back hair -->
  <ellipse cx="32" cy="24" rx="14" ry="17" fill="#0e1114"/>
  <ellipse cx="32" cy="26" rx="12" ry="15" fill="#d6ccb8"/>

  <!-- flat, unsmiling mouth -->
  <path d="M28 37h8" stroke="#7d7160" stroke-width="1.6" stroke-linecap="round"/>

  <!-- earpiece coiling into the collar -->
  <circle cx="46" cy="29" r="2" fill="#0e1114"/>
  <path d="M47 31c1 5 0 8-2 11" stroke="#0e1114" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- black wraparound glasses -->
  <g fill="#07090a">
    <rect x="15" y="20" width="15" height="9" rx="3"/>
    <rect x="34" y="20" width="15" height="9" rx="3"/>
    <rect x="29" y="23" width="6" height="2.5"/>
  </g>
  <path d="M15 23h-3M49 23h3" stroke="#07090a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M19 27l4-5M38 27l4-5" stroke="#3fb950" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>
</svg>
