[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "question_experiments"
version = "0.1.0"
requires-python = ">=3.10"
# PyYAML is a kedro dependency too, but store.py imports it directly — a transitive
# dependency is not a promise.
dependencies = ["kedro~=1.5.0", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.kedro]
package_name = "question_experiments"
project_name = "Question generation experiments"
kedro_init_version = "1.5.0"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "9a3d6980f2cc44cfab7f35b60277be05"
